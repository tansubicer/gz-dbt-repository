version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: "Greenweez'in ham verileri: satışlar, ürünler, kargo ve reklam bilgileri."
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Satış satırları. Her satır bir siparişteki bir ürünü temsil eder."
        config:
          loaded_at_field: "cast(date_date as timestamp)"
          freshness:
            warn_after:
              count: 90
              period: day
        data_tests:
          - unique:
              column_name: "concat(cast(orders_id as string), '_', cast(pdt_id as string))"
        columns:
          - name: date_date
            description: "Siparişin verildiği tarih."
          - name: orders_id
            description: "Siparişin kimliği."
          - name: pdt_id
            description: "Ürünün kimliği."
          - name: revenue
            description: "Bu ürün satırından elde edilen ciro."
          - name: quantity
            description: "Siparişteki ürün adedi."

      - name: product
        identifier: raw_gz_product
        description: "Ürün kataloğu ve alış fiyatları."
        columns:
          - name: products_id
            description: "Ürünün kimliği. Tablonun birincil anahtarı."
            data_tests:
              - unique
              - not_null
          - name: purchse_price
            description: "Ürünün birim alış fiyatı."

      - name: ship
        identifier: raw_gz_ship
        description: "Siparişlere ait kargo ve lojistik maliyetleri."
        columns:
          - name: orders_id
            description: "Siparişin kimliği. Tablonun birincil anahtarı."
            data_tests:
              - unique
              - not_null
          - name: shipping_fee
            description: "Müşterinin ödediği kargo ücreti."
          - name: shipping_fee_1
            description: "shipping_fee ile birebir aynı, kopya sütun."
          - name: logcost
            description: "Siparişin lojistik maliyeti (depolama, paketleme)."
          - name: ship_cost
            description: "Şirketin kargo firmasına ödediği tutar."

      - name: adwords
        identifier: raw_gz_adwords
        description: "Google Ads kampanyalarının günlük reklam verisi."

      - name: bing
        identifier: raw_gz_bing
        description: "Bing Ads kampanyalarının günlük reklam verisi."

      - name: criteo
        identifier: raw_gz_criteo
        description: "Criteo kampanyalarının günlük reklam verisi."

      - name: facebook
        identifier: raw_gz_facebook
        description: "Facebook Ads kampanyalarının günlük reklam verisi."

models:
  - name: int_campaigns
    description: "Dört reklam platformunun (Adwords, Bing, Criteo, Facebook) günlük kampanya verisinin birleşimi. Her satır bir kampanyanın bir günlük verisidir."
    data_tests:
      - unique:
          column_name: "concat(cast(date_date as string), '_', campaign_key)"
    columns:
      - name: date_date
        description: "Kampanya verisinin tarihi."
        data_tests:
          - not_null
      - name: paid_source
        description: "Reklam platformu."
        data_tests:
          - not_null
      - name: campaign_key
        description: "Kampanyanın kimliği."
        data_tests:
          - not_null
      - name: campaign_name
        description: "Kampanyanın adı."
        data_tests:
          - not_null
      - name: ads_cost
        description: "Günlük reklam harcaması."
        data_tests:
          - not_null
      - name: impression
        description: "Günlük gösterim sayısı."
        data_tests:
          - not_null
      - name: click
        description: "Günlük tıklama sayısı."
        data_tests:
          - not_null